name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The statements check diffs against the latest statements-v* tag, and
          # check.sh fails if this clone's latest tag differs from origin's.
          fetch-depth: 0
          fetch-tags: true

      # lean-action fetches the Lean toolchain once, with no retry, so a single TLS
      # error at releases.lean-lang.org turned #14 and #17 red. Restore the toolchain
      # from the cache; on a miss, install it here and retry network errors. Either
      # way lean-action finds it installed and doesn't download it again.
      - name: Restore the Lean toolchain
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}

      - name: Install the Lean toolchain, retrying network errors
        if: steps.elan-cache.outputs.cache-hit != 'true'
        working-directory: lean
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -sSf --retry 3 -o "$RUNNER_TEMP/elan-init.sh" \
                https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh &&
              sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none &&
              "$HOME/.elan/bin/lean" --version; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Attempt $attempt failed; retrying in $((attempt * 30)) s"
              sleep $((attempt * 30))
            fi
          done
          echo "Couldn't install the Lean toolchain in 5 attempts"
          exit 1

      # Installs Lean, fetches the Mathlib cache, runs `lake build`, then
      # replays every JSG module through the kernel with leanchecker.
      - uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1" # keeps leanchecker within runner memory with Mathlib
        with:
          lake-package-directory: lean
          # Mathlib's own cache covers dependencies; tarring lean/.lake (~5 GB)
          # for the GitHub cache runs the runner out of disk.
          use-github-cache: "false"
          leanchecker: "true"
          # Without arguments leanchecker derives the module name `Jsg` from the
          # package name `jsg`; the library is `JSG`.
          leanchecker-args: "JSG"

      - name: Forbidden tokens, axiom audit, statements check
        run: bash scripts/check.sh

      # The executable gate's harness (guide/EXECUTABLE_GATE.md §2): the golden examples,
      # the corpus's JSON round trip, and SirusSC's code against its predicted disagreements.
      # The negative controls are theorems, so the build above already checked them.
      - name: Differential tests
        shell: bash
        run: bash scripts/differential.sh

      # Comparator runs in this job so the required `build` check covers it.
      # Its tools are small and cached; the cache key changes with the pins.
      - name: Restore Comparator tools
        id: comparator-tools
        uses: actions/cache@v4
        with:
          path: ~/comparator-tools
          key: comparator-tools-${{ runner.os }}-${{ hashFiles('scripts/build-comparator-tools.sh', 'lean/lean-toolchain') }}

      - uses: actions/setup-go@v5
        if: steps.comparator-tools.outputs.cache-hit != 'true'
        with:
          go-version: stable

      - name: Build Comparator tools
        if: steps.comparator-tools.outputs.cache-hit != 'true'
        run: bash scripts/build-comparator-tools.sh "$HOME/comparator-tools"

      - name: Comparator (each proof proves exactly its frozen statement)
        run: |
          export PATH="$HOME/comparator-tools/bin:$PATH"
          bash scripts/comparator.sh
