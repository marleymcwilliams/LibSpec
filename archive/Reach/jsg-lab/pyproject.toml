[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jsg-lab"
version = "0.1.0"
description = "Joint Strategic Geometry Laboratory: geometry–statistics–control on stratified spaces"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name="Your Name", email="you@example.com"}]
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "pydantic>=2",
  "pandas>=2.2",
  "mlflow>=2.12",
  "jinja2>=3.1",
  "cvxpy>=1.4",     # PR/KYP LMI certification
  "matplotlib>=3.8" # for eval/report plots
  # JAX runtime is controlled via env/environment.yml
]

[project.optional-dependencies]
dev = [
  "pytest>=8", "pytest-cov>=5", "hypothesis>=6",
  "ruff>=0.5.0", "black>=24.3", "isort>=5.13",
  "mypy>=1.10", "pre-commit>=3.7",
  "dvc>=3.50", "snakemake>=8.0",
]
gpu = [
  "jax>=0.4", # paired with jaxlib in environment.yml (CPU/GPU variant)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 100
select = ["E","F","I","UP","B","N","ANN","ARG","D"]
ignore = ["D100","D104","D401","ANN101","ANN102"]  # relax docstring/type rules for brevity
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
plugins = []

