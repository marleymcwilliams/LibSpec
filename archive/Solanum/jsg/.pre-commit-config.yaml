repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/codespell-project/codespell
  rev: v2.3.0
  hooks: [{id: codespell, additional_dependencies: []}]
- repo: https://github.com/latex-lsp/chktex-action
  rev: v1.0.0
  hooks: [{id: chktex, files: '\\.(tex)$'}]
